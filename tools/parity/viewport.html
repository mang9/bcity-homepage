<!doctype html><meta charset="utf-8">
<!--
  좁은 뷰포트 측정용 호스트 — 2026-08-10 도입.

  ⚠ macOS 의 헤드리스 Chrome 은 --window-size 의 **폭을 500px 밑으로 내리지 못한다.**
    390 을 줘도 뷰포트가 500 으로 잡히는데 경고가 없다. 그래서 이 저장소의
    "390px 검증" 은 실제로는 전부 500px 였다(probe.py 포함).

  해결: 페이지를 <iframe width="390"> 안에 띄운다. 미디어쿼리는 **아이프레임 뷰포트**를
  기준으로 평가되므로 진짜 390px 레이아웃이 나온다. 같은 오리진이라 안에서 측정도 된다.

    http://localhost:8893/tools/parity/viewport.html?w=390&p=company.html

  ⚠ 히어로 배경(.hero-bg)은 object-fit:cover 라 뷰포트보다 넓게 잡힌다 — 정상이다.
    가로 넘침 판정은 요소 폭이 아니라 documentElement.scrollWidth 로 본다.
-->
<style>html,body{margin:0}iframe{border:0;display:block}</style>
<iframe id="f"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var W = +(q.get('w') || 390), f = document.getElementById('f');
  f.width = W; f.height = 900; f.src = '/' + (q.get('p') || 'company.html');
  f.onload = function(){ setTimeout(function(){
    var d = f.contentDocument, P = function(s){ return [].slice.call(d.querySelectorAll(s)); };
    var wide = [];
    P('body *').forEach(function(e){ var r = e.getBoundingClientRect();
      if (r.width > W + 1) wide.push((e.tagName + '.' + (e.className||'')).slice(0,40) + ' ' + Math.round(r.width)); });
    var out = { vw: f.contentWindow.innerWidth, docW: d.documentElement.scrollWidth,
      넘침: wide.slice(0,6) };
    // 기대효과 전용 계측
    var zf = P('.zf');
    if (zf.length) {
      out.블록 = zf.length;
      out.사진폭 = zf.map(function(e){ return Math.round(e.querySelector('.zf-fig').getBoundingClientRect().width); });
      out.블록폭 = [].concat(new Set(zf.map(function(e){ return Math.round(e.getBoundingClientRect().width); })).size ? Array.from(new Set(zf.map(function(e){return Math.round(e.getBoundingClientRect().width)}))) : []);
      out.왼쪽끝 = Array.from(new Set(zf.map(function(e){ return Math.round(e.getBoundingClientRect().left); })));
      // 본문 안쪽 선이 .wrap 콘텐츠 왼쪽과 맞는지
      var wrap = d.querySelector('#value .wrap');
      var wl = wrap.getBoundingClientRect().left + parseFloat(f.contentWindow.getComputedStyle(wrap).paddingLeft);
      var flip = zf.filter(function(e){ return e.classList.contains('zf--flip'); });
      // ⚠ 박스 바깥이 아니라 **패딩 안쪽**을 재야 한다. 꽉 찬 2단은 본문 열이
      //   화면 끝에서 시작하고 안쪽 선을 padding 으로 만든다.
      out.본문안쪽선_오차 = flip.map(function(e){
        var b = e.querySelector('.zf-body');
        return Math.round(b.getBoundingClientRect().left
          + parseFloat(f.contentWindow.getComputedStyle(b).paddingLeft) - wl); });
    }
    var cu = P('[data-count]');
    out.카운트대상 = cu.length;
    out.카운트값 = cu.map(function(e){ return e.textContent; });
    out.모션초기 = (function(){ var im = d.querySelector('.zf-fig img');
      return im ? f.contentWindow.getComputedStyle(im).transform : null; })();
    if (zf.length) {
      out.블록사이 = zf.slice(1).map(function(e,i){
        return Math.round(e.getBoundingClientRect().top - zf[i].getBoundingClientRect().bottom); });
      out.사진높이 = zf.map(function(e){ return Math.round(e.querySelector('.zf-fig').getBoundingClientRect().height); });
    }
    var cl = d.querySelector('.closer');
    if (cl && zf.length) {
      var last = zf[zf.length-1].getBoundingClientRect(), cr = cl.getBoundingClientRect();
      out.마무리_붙음 = Math.round(cr.top - last.bottom);
      var st = f.contentWindow.getComputedStyle(cl, '::before');
      out.구분선폭 = st.width; out.구분선_왼쪽 = Math.round(cr.left + parseFloat(st.left||0));
    }
    var pre = document.createElement('pre');
    pre.textContent = '###' + JSON.stringify(out) + '###';
    document.body.appendChild(pre);
  }, 1800); };
</script>
