    <!-- ⚠⚠ 이 페이지는 일반 빌드 목록에서 빠진다(이름이 `_` 로 시작한다).
         `tools/build/pages.mjs` 의 **`build404()` 가 따로** 만든다. 이유가 셋이다.
           ① `nav.json` 의 카테고리에 속하지 않는다 → LNB · 브레드크럼 · `is-on` 이 없다
           ② **사이트맵에 넣어서는 안 된다** — 오류 페이지를 색인 후보로 제출하는 셈이다
           ③ 자산 · 링크 주소를 **루트 상대로 바꿔야** 한다(아래)

         ⚠⚠ **상대 경로가 통하지 않는다.** 404 는 요청된 주소 그대로의 URL 에서 그려지므로
           (`/a/b/c` 를 요청하면 브라우저 주소는 `/a/b/c` 다) `assets/…` 는
           `/a/b/assets/…` 로 풀려 폰트 · 파비콘 · 메뉴 링크가 전부 깨진다.
           `build404()` 가 `SITE_URL` 의 경로로 접두어를 붙이고, 남은 상대 주소가 있으면
           **빌드를 죽인다.** 그래서 본문에 주소를 손으로 적을 때도 상대 경로를 쓰면 안 된다 —
           링크는 `nav.json` 에서 오게 하고, 이미지는 쓰지 않는다.

         ⚠ 404 는 **404 상태코드와 함께** 나가야 한다. 파일만 있으면 안 된다.
           GitHub Pages 는 루트의 `404.html` 을 자동으로 그렇게 쓴다.
           nginx 는 `error_page 404 /404.html;` 이 필요하다(HANDOFF §10.12).
           200 으로 나가면 구글이 **소프트 404** 로 쌓는다.

         ⚠ 아래 미니 사이트맵 자리는 빌더가 `nav.json` 으로 만든다 — 메뉴가 바뀌면 함께
           바뀐다. 여기에 링크를 손으로 적으면 메뉴와 어긋난다.
         ⚠⚠ **이 주석에 치환 문법(중괄호 두 개)을 글자로도 쓰지 말 것.** 빌더의 치환은
           `String.replace(문자열, …)` 이라 **첫 번째 하나만** 바꾼다. 주석에 같은 이름을
           적어 두면 그쪽이 살아남아 "전개되지 않은 { { } } 가 남았다"로 빌드가 죽는다
           (2026-09-08 에 실제로 겪었다 — layout.html:36 이 경고하는 것과 같은 함정이다). -->
    <section class="nf">
      <div class="wrap nf-in">
        <!-- 큰 숫자 `4 ◆ 4` — **0 자리에 브랜드 심볼**이 들어간다. 심볼은 빌더가

             ⚠ 아이브로우(`404 · NOT FOUND`)를 **없앴다** — 숫자가 그 역할을 하므로
               같은 정보가 두 번 나온다.
             ⚠⚠ 이 주석에 치환 문법(중괄호 두 개)을 글자로도 쓰지 말 것 — 첫 번째만

        <p class="nf-num" role="img" aria-label="404">
