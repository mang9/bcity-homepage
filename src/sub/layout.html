<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <!-- 파비콘 — 원본 심볼은 assets/favicon/favicon.svg 이고 PNG·ICO 는 거기서 파생된다.
       SVG 를 먼저 두면 지원 브라우저는 그것만 쓴다(선명하고 4KB 미만).
       루트의 favicon.ico 는 <link> 와 무관하게 브라우저가 자동으로 요청하므로 함께 둔다. -->
  <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/favicon/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#2c3e91" />

  <!-- 오프라인 시연용 로컬 폰트 (index.html 과 동일) -->
  <link href="assets/vendor/inter/inter.local.css" rel="stylesheet" />
  <link href="assets/vendor/pretendard/pretendard.local.css" rel="stylesheet" />
  <link href="assets/vendor/paperlogy/paperlogy.local.css" rel="stylesheet" />

  <style>
{{css}}
  </style>
</head>

<body{{bodyAttr}}>
  <a href="#main" class="sr">본문으로 건너뛰기</a>

{{> gnb}}

  <main id="main">
  <!-- 상단 블록 — 카테고리에 따라 [히어로 + LNB] 또는 [LNB 만] 이다.
       어느 쪽인지는 nav.json 의 `hero` 가 정하고, 빌드(heroBlock)가 골라 미리 펼쳐 넣는다.
       파티셜 이름을 여기에 박으면 카테고리별로 바꿀 수 없어 값으로 받는다.
       ⚠ 이 주석에 파티셜 호출 문법을 **글자로도 쓰지 말 것.** render() 는 HTML 주석을
         구분하지 않아 주석 안의 호출까지 전개한다 — 히어로가 두 번 들어간다(실측). -->
{{hero}}

{{main}}
  </main>

{{> footer}}

  <!-- 문의 모달 — front-matter 에 "contactModal": true 인 페이지만 값이 들어온다.
       ⚠ 파티셜 호출을 여기 직접 쓰지 않는다. 전 페이지에 실리면 마크업 6.8KB +
         CSS 11KB + JS 5KB 가 18개 페이지에 붙는다 — 쓰는 페이지만 싣는다. -->
{{contactModal}}

  <script>
{{js}}
  </script>
</body>
</html>
