<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <!-- 파비콘 — 원본 심볼은 assets/favicon/favicon.svg 이고 PNG·ICO 는 거기서 파생된다.
       SVG 를 먼저 두면 지원 브라우저는 그것만 쓴다(선명하고 4KB 미만).
       루트의 favicon.ico 는 <link> 와 무관하게 브라우저가 자동으로 요청하므로 함께 둔다. -->
  <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/favicon/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#2c3e91" />

  <!-- 오프라인 시연용 로컬 폰트 (index.html 과 동일) -->
  <link href="assets/vendor/inter/inter.local.css" rel="stylesheet" />
  <link href="assets/vendor/pretendard/pretendard.local.css" rel="stylesheet" />
  <link href="assets/vendor/paperlogy/paperlogy.local.css" rel="stylesheet" />

  <style>
{{css}}
  </style>
</head>

</body>
</html>
