<!-- 지명·노선명. 아웃라인이 아니라 <text> 라 확대·검색·낭독에 견딘다.
     ⚠ 글자 스타일은 SVG 안 <style> 이 아니라 page-location.css 에 있다 —
       SVG 내부 <style> 은 lint-classes 가 보지 못해 "정의 없는 클래스" 로 잡힌다. -->
<svg class="tmap-lay tmap-labels" aria-label="교통 정보" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-label="B-CITY 광역 교통망 텍스트">
  <g id="labels-itx-cheongchun" data-route="itx-cheongchun" data-transport="rail">
    <text class="tl-place" x="235.3" y="576.1">청량리역</text>
    <text class="tl-place" x="436.8" y="474.9">마석역</text><text class="tl-place" x="562.2" y="383.2">가평역</text>
    <text class="tl-place" x="670.1" y="361.4">강촌역</text><text class="tl-place" x="725.4" y="309.2">춘천역</text>
    <text class="tl-route" x="492.5" y="452.9" fill="#1758B5" transform="rotate(-36.16 492.5 452.9)">ITX-청춘</text>
  </g>
    <!-- ⚠ 서울역은 **GTX-B 그룹**이다(2026-09-22 지시: ITX 는 청량리 시작) — 그 역을
       지나는 노선이 GTX-B 하나뿐이다. 「그룹 = 그 라벨이 앉은 선」이 이 지도의 불변식이다. -->
  <!-- ⚠ GTX-B 노선명은 **자기 선 위쪽**이다(2026-09-22 지시). 「위쪽」이 가능한 구간은
       청량리~마석 뿐이다 — 가평~춘천 구간은 GTX-B 가 ITX 아래로 내려가고 두 선 사이
       간격이 14px 라 19px 글자가 들어가지 않는다(실측). 그 대가로 라벨이 「연장선」
       구간(마석~춘천)이 아니라 본선 구간에 붙는다 — 이름은 노선 전체를 가리키므로 감수한다. -->
  <g id="labels-gtx-b" data-route="gtx-b" data-transport="rail">
    <text class="tl-place" x="144.8" y="615.5">서울역</text>
    <text class="tl-route tl-small" x="297.5" y="515.5" fill="#19AFA6" transform="rotate(-14.13 297.5 515.5)">GTX-B 연장선(예정)</text>
  </g>
  <g id="labels-seoul-yangyang" data-route="seoul-yangyang" data-transport="road">
    <text class="tl-place" x="253.3" y="674.9">잠실</text><text class="tl-place" x="362" y="612">화도IC</text><text class="tl-place" x="603" y="555">강촌IC</text>
    <text class="tl-route" x="472" y="571.5" fill="#527EA8">서울양양고속도로</text>
  </g>
  <g id="labels-second-gyeongchun" data-route="second-gyeongchun" data-transport="road">
    <text class="tl-place" x="510" y="522">금남JCT</text>
    <!-- ⚠⚠ 표기는 **`제2경춘국도`** 다. 첨부 참고 지도에는 `제2경춘고속화도로(예정)` 로
         적혀 있지만, 이 사이트는 `국도` 로 확정돼 있다(사용자: 「그게 더 공식명칭이래」) —
         같은 페이지의 도로 카드 · 요약 · description · 메인 카피가 전부 `국도` 다.
         지도만 `고속화도로` 로 두면 **한 페이지 안에서 이름이 갈린다.** -->
    <text class="tl-route tl-small" x="542" y="484.5" fill="#19AFA6">제2경춘국도(예정)</text>
  </g>
  <!-- ⚠⚠ 양평JCT 라벨은 마커 **오른쪽이 아니라 아래**다. 오른쪽에 두면 영문
       `Yangpyeong JCT`(국문 60px → 119px)가 `Vivaldi Park` 와 60px 겹친다(실측).
       아래로 내리면 두 언어가 같은 좌표로 성립한다 — 영문 전용 FIXUP 이 필요 없다.
    ⚠ 지점명은 메인 지도(01)와 같은 표기다 — `감일JCT` · `양평JCT` 로 **(예정)을 붙이지
       않는다.** 노선 라벨이 (예정)을 이미 말하고, 붙이면 폭이 112px 로 늘어 두 라벨이 겹친다.
    ⚠⚠ 양평JCT 의 `y` 는 **690 → 682**(2026-09-29 지시 「마커에 좀 더 가깝게」).
       마커 여유를 정하는 축은 **세로 하나**다 — `x` 를 바꿔도 여유가 7.0 으로 고정이고
       영문 라벨 여유만 나빠진다(x−8 에서 `Seoul–Yangpyeong Expwy` 8.7 → 3.2).
       세로로만 당기면 국문·영문이 **같은 값으로 성립**한다(여유 1.5 · 이웃 화도IC 0.9 ·
       감일JCT 1.8 과 같은 대). 이 라벨을 다시 옮길 때도 `y` 로만 조절할 것. -->
  <g id="labels-seoul-yangpyeong" data-route="seoul-yangpyeong" data-transport="road">
    <text class="tl-place" x="391.4" y="705">감일JCT</text><text class="tl-place" x="492" y="682">양평JCT</text>
    <text class="tl-route tl-small" x="431" y="627.5" fill="#19AFA6">서울~양평고속도로(예정)</text>
  </g>
  <!-- 춘천시청 · 강원도청 — 경로 없이 위치만(2026-09-22 지시). `data-transport="common"` 은
       markers 쪽 주석 참고. ⚠ 마커(776,370)는 **춘천역에서 남동쪽**이라는 방향만 맞춘 개략 위치다 —
       실제 거리는 춘천역에서 약 1.1km 라 이 축척(약 7~9px/km)에서는 r=12 마커가 춘천역과 겹친다. -->
  <g id="labels-civic" data-route="civic" data-transport="common">
    <text class="tl-place" x="805.1" y="367.1">춘천시청 · 강원도청</text>
  </g>
  <g id="labels-yangyang-airport" data-route="yangyang-airport" data-transport="air"><text class="tl-place" x="1378.1" y="279.9">양양국제공항</text></g>
  <g id="labels-sokcho-port" data-route="sokcho-port" data-transport="port"><text class="tl-place" x="1328.9" y="147.8">속초항</text></g>
    <!-- ⚠ 남춘천IC 는 **동해항 그룹**이다(2026-09-22 지시로 그 경로 위로 옮겼다).
       대가: 도로 카드에서 강조되지 않는다. 「그룹 = 그 라벨이 앉은 선」을 지킨 결과이고,
       도로 그룹에 두면 도로 카드에서 선 없는 마커가, 항만 카드에서 밝은 선 위의
       흐린 마커가 된다 — 어느 쪽도 맞지 않는다. -->
  <g id="labels-donghae-port" data-route="donghae-port" data-transport="port">
    <text class="tl-place" x="793" y="558">남춘천IC</text>
    <text class="tl-place" x="1562.5" y="688.3">동해항</text>
  </g>
  <g id="label-bcity" data-route="bcity" data-transport="common">
    <rect x="656" y="564" width="118" height="38" rx="11" fill="#0B3677"/>
    <text x="714.5" y="592" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">B-CITY</text>
    <text class="tl-place tl-hero" x="714" y="629" text-anchor="middle">춘천 광판리</text>
  </g>
</svg>
