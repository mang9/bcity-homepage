<!-- 지명·노선명. 아웃라인이 아니라 <text> 라 확대·검색·낭독에 견딘다.
     ⚠ 글자 스타일은 SVG 안 <style> 이 아니라 page-location.css 에 있다 —
       SVG 내부 <style> 은 lint-classes 가 보지 못해 "정의 없는 클래스" 로 잡힌다. -->
<svg class="tmap-lay tmap-labels" aria-label="교통 정보" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-label="B-CITY 광역 교통망 텍스트">
