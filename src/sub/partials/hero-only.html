         대메뉴에 속하지 않는 단일 페이지용이다 — 지금은 회사소개 하나뿐이며 푸터에서만 닿는다
         (2026-08-25 지시: "위에 메뉴로 올리지 말고 … 앵커메뉴 필요없이 원페이지로").
         ⚠ `hero.html` 과의 차이는 **두 가지뿐**이다:
