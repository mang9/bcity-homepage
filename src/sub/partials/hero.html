    <!-- ===== 히어로 ===== -->
    <section class="hero">
      <!-- ⚠ `heroPos` 는 front-matter 의 선택 키다. 값이 없으면 속성 자체가 나오지 않고
           공용 `object-position: center`(기본)이 쓰인다. **이미지를 다시 굽지 않고**
           구도만 다시 잡을 때 쓴다(§11.15 의 광역 인프라 사진과 같은 어법).
           `center 72%` 처럼 두 번째 값이 클수록 **보이는 창이 아래로** 내려가므로
           화면에서는 그림이 위로 올라간다. -->
      <img class="hero-bg" src="{{heroImg}}"{{heroPos}} alt="" />
      <div class="hero-scrim" aria-hidden="true"></div>
      <div class="wrap">
        <nav class="crumb" aria-label="현재 위치">
          <a href="index.html">HOME</a><span aria-hidden="true">›</span>
          <span>{{catLabel}}</span><span aria-hidden="true">›</span><b>{{navLabel}}</b>
        </nav>
        <p class="hero-eyebrow"><i aria-hidden="true"></i><b>{{catNo}}</b><span>{{catEn}} · {{catLabel}}</span></p>
        <h1>{{h1}}</h1>
        <!-- 페이지가 front-matter 에 `heroLede` 를 두면 제목 아래 한 줄이 붙는다.
             원페이지로 합친 투자·입주가 상단 카피를 여기 담기 위해 생겼다(2026-08-24 지시).
             ⚠ 값이 없으면 **문단 자체가 나오지 않는다** — 빈 `<p>` 를 남기면 여백만 생긴다. -->
{{heroLede}}
      </div>
    </section>

    <!-- ===== LNB ===== -->
    <nav class="lnb" aria-label="{{catLabel}} 하위 메뉴">
      <div class="wrap">
{{lnbItems}}
      </div>
    </nav>
