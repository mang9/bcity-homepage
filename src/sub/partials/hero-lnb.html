    <!-- ===== 서브 상단 — 히어로 없이 LNB 만 =====
         도시소개 · 투자·입주 는 상단 이미지 영역 없이 GNB 바로 아래에 하위 메뉴만 온다
         (2026-08-21 지시). 어느 카테고리가 이 형태인지는 `nav.json` 의 `hero: false` 가 정한다.

         ⚠ `h1` 을 없애지 않고 **화면에서만 감춘다.** 이 페이지들의 본문 제목은 모두 `.h2` 라
           h1 을 빼면 문서에 h1 이 하나도 없게 된다 — 검색 노출과 스크린리더 목차가 함께 죽는다.
         ⚠ 브레드크럼은 뺀다. 보여 줄 자리가 없고, 같은 정보를 LNB 의 현재 항목
           (`aria-current="page"`)이 이미 전달한다. -->
    <h1 class="sr">{{catLabel}} · {{h1}}</h1>

    <!-- ===== LNB ===== -->
    <nav class="lnb" aria-label="{{catLabel}} 하위 메뉴">
      <div class="wrap">
{{lnbItems}}
      </div>
    </nav>
