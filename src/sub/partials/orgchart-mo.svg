<!-- 사업추진 체계 구조도 (모바일) — 납품본 bcity-business-structure-mobile.svg 를 다듬은 것.
     ⚠ 원본은 ~/Downloads/business-structure-v1 이고, 여기 있는 것은 가공본이다.
       가공 내용: 폰트 이름을 사이트 스택으로 교체 · 금융 파트너 표기 조정 · id 네임스페이스.
       다시 받으면 tools 가 아니라 이 파일을 통째로 다시 만든다. -->
<svg class="orgfig-svg orgfig-svg--mo" xmlns="http://www.w3.org/2000/svg" width="900" height="1900" viewBox="0 0 900 1900" role="img" aria-labelledby="bsm-title bsm-desc">
  <title id="bsm-title">B-CITY PFV 사업 구조도 모바일</title><desc id="bsm-desc">모바일 세로형 PFV 사업 구조도</desc>
  <defs><style>.bg{fill:#f5f8fc}.card{fill:#fff;stroke:#d8e1ec;stroke-width:2}.t{font-family:"Paperlogy", "Pretendard", "Noto Sans KR", sans-serif;fill:#0e1e33}.b{font-family:"Pretendard", "Inter", sans-serif;fill:#34455c}.sm{font-size:21px}.body{font-size:25px}.h{font-size:32px;font-weight:700}.core{font-size:38px;font-weight:700}.pct{font-size:28px;font-weight:700;fill:#2155ff}.in{stroke:#2155ff;stroke-width:4;fill:none}.out{stroke:#22b7a7;stroke-width:4;fill:none}.dash{stroke:#7b8ca5;stroke-width:3;stroke-dasharray:10 9;fill:none}.navy{fill:#0e1e33}.white{fill:#fff}.blue{fill:#eaf0ff;stroke:#2155ff}.mint{fill:#e6f8f4;stroke:#22b7a7}</style><marker id="bsm-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2155ff"/></marker><marker id="bsm-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22b7a7"/></marker></defs>
  <rect width="900" height="1900" class="bg"/><text x="450" y="58" text-anchor="middle" class="t sm" fill="#2155ff">B-CITY BUSINESS STRUCTURE</text><text x="450" y="105" text-anchor="middle" class="t h">PFV 중심의 투명한 사업 운영 구조</text><text x="450" y="140" text-anchor="middle" class="b sm">자본금 · 대출 · 분양수익 통합 관리</text>
  <g><rect x="70" y="190" width="760" height="125" rx="22" class="card"/><text x="105" y="240" class="t h">토지소유주</text><text x="105" y="282" class="b body">토지 매매 ↔ 토지 보상비</text><rect x="70" y="335" width="760" height="125" rx="22" class="card"/><text x="105" y="385" class="t h">수분양자</text><text x="105" y="427" class="b body">분양대금 ↔ 용지분양</text><rect x="70" y="480" width="760" height="125" rx="22" class="card"/><text x="105" y="530" class="t h">금융기관</text><text x="105" y="572" class="b body">PF대출약정 ↔ PF대출원리금 상환</text></g>
  <path d="M420 620V680" class="in" marker-end="url(#bsm-ab)"/><path d="M480 680V620" class="out" marker-end="url(#bsm-am)"/><text x="235" y="655" class="b sm">PFV 유입</text><text x="510" y="655" class="b sm">PFV 지출·권리 이전</text>
  <rect x="70" y="690" width="760" height="190" rx="30" class="navy"/><text x="450" y="750" text-anchor="middle" class="white sm" font-family="Pretendard">PROJECT CORE</text><text x="450" y="805" text-anchor="middle" class="white core" font-family="Paperlogy">바이오테크 이노밸리 PFV</text><text x="450" y="850" text-anchor="middle" fill="#b8c8dd" class="body" font-family="Pretendard">명목회사 · 사업 시행 주체</text>
  <rect x="110" y="910" width="680" height="120" rx="22" class="card"/><text x="145" y="953" class="t sm" font-weight="700" fill="#22a7b8">AMC · PFV와 분리 운영</text><text x="145" y="993" class="t body" font-weight="700">바이오테크이노밸리자산관리㈜</text><text x="145" y="1020" class="b sm">전문 운용 · 사업 실행 관리</text>
  <path d="M450 1115V1045" class="in" marker-end="url(#bsm-ab)"/><rect x="270" y="1065" width="360" height="54" rx="27" class="blue"/><text x="450" y="1100" text-anchor="middle" class="t body" font-weight="700">출자금 납부 · 진행 중</text>
  <text x="450" y="1170" text-anchor="middle" class="t h">PFV 출자자</text>
  <g><rect x="70" y="1200" width="760" height="125" rx="22" class="card"/><text x="105" y="1245" class="t body" font-weight="700">앵커기업</text><text x="105" y="1290" class="b sm">더존비즈온 37.3% · AMC 0.2%</text><rect x="70" y="1340" width="760" height="125" rx="22" class="card"/><text x="105" y="1385" class="t body" font-weight="700">GI · 공공</text><text x="105" y="1430" class="b sm">강원특별자치도 4.9% · 춘천시 4.9%</text><rect x="70" y="1480" width="760" height="125" rx="22" class="card"/><text x="105" y="1525" class="t body" font-weight="700">FI · 금융</text><text x="105" y="1564" class="b sm">IBK투자증권 5.0%</text><text x="105" y="1593" class="b" font-family="Pretendard" font-size="17">사업자금 조달 및 금융 파트너</text><rect x="70" y="1620" width="365" height="150" rx="22" class="card"/><text x="105" y="1665" class="t body" font-weight="700">CI · 시공</text><text x="105" y="1705" class="b sm">부지조성공사 등</text><text x="105" y="1740" class="pct">TBD</text><rect x="465" y="1620" width="365" height="150" rx="22" class="card"/><text x="500" y="1665" class="t body" font-weight="700">SI · 전략</text><text x="500" y="1705" class="b sm">CDMO · 제약 · 바이오</text><text x="500" y="1740" class="pct">TBD</text></g>
  <rect x="110" y="1795" width="680" height="70" rx="18" fill="#fff" stroke="#7b8ca5" stroke-width="2" stroke-dasharray="9 8"/><text x="450" y="1825" text-anchor="middle" class="t sm" font-weight="700">공사도급계약 및 책임준공</text><text x="450" y="1852" text-anchor="middle" class="b sm">CI는 출자자이자 PFV 도급 파트너</text>
</svg>
